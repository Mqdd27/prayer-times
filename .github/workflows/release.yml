# Push a version tag to publish a release:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub Release and upload the dmg

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package DMG
        # App + Applications shortcut, so users install by dragging one onto the other
        run: |
          mkdir -p build/dmg
          cp -R build/PrayerTimes.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Prayer Times" -srcfolder build/dmg -format UDZO -fs HFS+ -ov "PrayerTimes-${GITHUB_REF_NAME}.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PrayerTimes-${GITHUB_REF_NAME}.dmg" \
            --title "Prayer Times ${GITHUB_REF_NAME}" \
            --generate-notes
