# Push a version tag to publish a release:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub Release and upload the zip

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent build/PrayerTimes.app "PrayerTimes-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PrayerTimes-${GITHUB_REF_NAME}.zip" \
            --title "Prayer Times ${GITHUB_REF_NAME}" \
            --generate-notes
